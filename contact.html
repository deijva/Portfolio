<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./resources/css/index.css" type="text/css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <title>Kontakt</title>
</head>

<body>
    <div class="contact" ID="contact">
        <h1>Contact</h1>
        <form class="contact-form" id="contact-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstname">Vorname</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Vorname" required>
                </div>
                <div class="form-group">
                    <label for="lastname">Nachname</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Nachname" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" placeholder="deine@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Dein Anliegen</label>
                <textarea id="message" name="message" rows="6" placeholder="Schreib mir dein Anliegen"
                    required></textarea>
            </div>
            <button type="submit">Senden</button>
            <p id="form-status"></p>
        </form>
    </div>

    <script src="resources/js/contact.js"></script>
    <script src="resources/js/layout.js"></script>
    <script src="resources/js/nav.js"></script>
</body>

</html>
